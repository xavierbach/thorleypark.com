<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Lost in the garden — Thorley Park</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --garden-green: #1a3a0a;
    --garden-green-light: #3d6b1e;
    --garden-cream: #f5f0e8;
    --garden-bg: #faf8f4;
    --gold: #c4a44a;
    --gold-line: rgba(196, 164, 74, 0.45);
    --text-mid: #4a4a4a;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 300;
    color: var(--garden-green);
    background: var(--garden-bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Soft cream radial wash, like late-afternoon light through the trees */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, var(--garden-cream) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(61, 107, 30, 0.06) 0%, transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 32px;
    position: relative;
    z-index: 1;
  }

  .fountain {
    width: 84px;
    height: auto;
    opacity: 0.85;
    margin-bottom: 36px;
  }

  .label {
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 22px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2.6rem, 6vw, 4.4rem);
    line-height: 1.05;
    color: var(--garden-green);
    letter-spacing: -0.005em;
  }

  .gold-line {
    width: 56px;
    height: 1px;
    background: var(--gold-line);
    margin: 32px auto;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.05rem, 2vw, 1.25rem);
    line-height: 1.65;
    color: var(--text-mid);
    max-width: 460px;
    font-style: italic;
  }

  .actions {
    margin-top: 48px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 14px 28px;
    border: 1px solid var(--garden-green);
    color: var(--garden-green);
    background: transparent;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn:hover {
    background: var(--garden-green);
    color: var(--garden-cream);
  }

  .btn-primary {
    background: var(--garden-green);
    color: var(--garden-cream);
  }

  .btn-primary:hover {
    background: var(--garden-green-light);
    border-color: var(--garden-green-light);
  }

  footer {
    text-align: center;
    padding: 32px;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-mid);
    opacity: 0.6;
    position: relative;
    z-index: 1;
  }

  footer span {
    color: var(--gold);
    margin: 0 6px;
  }

  @media (max-width: 480px) {
    .fountain { width: 64px; margin-bottom: 28px; }
    .actions { flex-direction: column; width: 100%; max-width: 280px; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<main>
  <img src="/images/fountain.png" alt="Thorley Park fountain" class="fountain">
  <div class="label">Error 404</div>
  <h1>Lost in the garden.</h1>
  <div class="gold-line"></div>
  <p class="subtitle">
    The path you followed has grown over &mdash; or was never planted at all.
    Find your way back to familiar ground.
  </p>
  <div class="actions">
    <a href="/" class="btn btn-primary">Return home</a>
    <a href="/garden.html" class="btn">Visit the garden</a>
  </div>
</main>

<footer>
  Thorley Park <span>&middot;</span> Mount Macedon
</footer>

</body>
</html>
