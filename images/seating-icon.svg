<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Seating Planner app icon">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c251f"/>
      <stop offset="1" stop-color="#1b1713"/>
    </linearGradient>
    <linearGradient id="spGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#spBg)"/>
  <!-- round linen table -->
  <circle cx="24" cy="24" r="10.5" fill="#f4eee2"/>
  <circle cx="24" cy="24" r="5.5" fill="#7a2e2e" opacity="0.14"/>
  <!-- place cards around the ring; one lifted in brass -->
  <g>
    <rect x="18.5" y="3.5" width="11" height="6" rx="2" fill="#c2a05a"/>
    <rect x="35" y="9" width="11" height="6" rx="2" fill="#ffffff" transform="rotate(60 40.5 12)"/>
    <rect x="35" y="33" width="11" height="6" rx="2" fill="#ffffff" transform="rotate(120 40.5 36)"/>
    <rect x="18.5" y="38.5" width="11" height="6" rx="2" fill="#ffffff"/>
    <rect x="2" y="33" width="11" height="6" rx="2" fill="#ffffff" transform="rotate(60 7.5 36)"/>
    <rect x="2" y="9" width="11" height="6" rx="2" fill="#ffffff" transform="rotate(120 7.5 12)"/>
  </g>
  <!-- glass highlight -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#spGlass)"/>
</svg>
