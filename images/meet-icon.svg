<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Meeting Time app icon">
  <defs>
    <linearGradient id="mtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mtGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#mtBg)"/>
  <!-- globe meridians, faint -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.3">
    <circle cx="24" cy="24" r="13"/>
    <ellipse cx="24" cy="24" rx="6" ry="13"/>
    <line x1="11" y1="24" x2="37" y2="24"/>
    <path d="M13 17 Q24 21 35 17"/>
    <path d="M13 31 Q24 27 35 31"/>
  </g>
  <!-- clock face -->
  <circle cx="24" cy="24" r="11" fill="#ffffff"/>
  <circle cx="24" cy="24" r="11" fill="none" stroke="#1d4ed8" stroke-opacity="0.12" stroke-width="1"/>
  <!-- ticks -->
  <g stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round">
    <line x1="24" y1="15.5" x2="24" y2="17"/>
    <line x1="24" y1="31" x2="24" y2="32.5"/>
    <line x1="15.5" y1="24" x2="17" y2="24"/>
    <line x1="31" y1="24" x2="32.5" y2="24"/>
  </g>
  <!-- hands -->
  <line x1="24" y1="24" x2="24" y2="18.5" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="28.5" y2="26" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="24" cy="24" r="1.4" fill="#0f172a"/>
  <!-- glass highlight -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#mtGlass)"/>
</svg>
