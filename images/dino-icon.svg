<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Primal Run app icon">
  <defs>
    <linearGradient id="prBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#f5872b"/>
    </linearGradient>
    <linearGradient id="prDino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d8b3d"/>
      <stop offset="1" stop-color="#2c6b2c"/>
    </linearGradient>
    <linearGradient id="prGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#prBg)"/>
  <!-- sun -->
  <circle cx="12" cy="13" r="6" fill="#fff6da" opacity="0.85"/>
  <!-- distant volcano -->
  <path d="M30 40 L39 22 L48 40 Z" fill="#5b4a52" opacity="0.45"/>
  <!-- ground line -->
  <rect x="4" y="38" width="40" height="6" rx="2" fill="#6b4f32" opacity="0.55"/>
  <!-- T-Rex silhouette, mid-stride, facing right -->
  <g fill="url(#prDino)">
    <!-- tail -->
    <path d="M9 28 Q4 27 3 23 Q8 26 13 27 Z"/>
    <!-- body + head -->
    <path d="M11 30
             Q10 22 18 21
             Q24 20.5 26 24
             L33 23
             Q36 23 36 26
             Q36 28 33.5 28.2
             L29 28.6
             Q28.5 32 24 32
             L23 38 L20 38 L20.5 32
             Q15 32 13 31 Z"/>
  </g>
  <!-- jaw teeth -->
  <path d="M30 27.6 l1.4 1.6 1.5-1.5 1.5 1.4" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="31.5" cy="25.2" r="1.3" fill="#ffffff"/>
  <circle cx="32" cy="25.2" r="0.7" fill="#111111"/>
  <!-- back leg -->
  <path d="M16 31.5 L15.5 38 L18 38 L18.5 31.8 Z" fill="#2c6b2c"/>
  <!-- glass highlight -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#prGlass)"/>
</svg>
