<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Aquascape app icon">
  <defs>
    <linearGradient id="aqWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2bb6cf"/>
      <stop offset="0.55" stop-color="#1f8fb8"/>
      <stop offset="1" stop-color="#155e86"/>
    </linearGradient>
    <linearGradient id="aqGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#aqWater)"/>
  <!-- substrate -->
  <path d="M0 38 Q12 34 24 37 T48 37 V48 H0 Z" fill="#0d4663" opacity="0.85"/>
  <ellipse cx="13" cy="40" rx="4" ry="2.4" fill="#0a3650"/>
  <ellipse cx="33" cy="41" rx="5" ry="2.8" fill="#0a3650"/>
  <!-- plants -->
  <path d="M9 40 C7 33 11 30 9.5 24" fill="none" stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M12 40 C13 34 10.5 31 13 26" fill="none" stroke="#2fc46f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M39 41 C41 35 37 31 39 25" fill="none" stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M36 41 C35 36 38 33 35.5 28" fill="none" stroke="#2fc46f" stroke-width="2.2" stroke-linecap="round"/>
  <!-- fish -->
  <g>
    <ellipse cx="25" cy="22" rx="7.5" ry="4.6" fill="#ffd166"/>
    <path d="M17.8 22 L13 18.5 L13.5 22 L13 25.5 Z" fill="#f5a93b"/>
    <circle cx="28.5" cy="20.6" r="1.2" fill="#10384f"/>
    <path d="M24 17.6 Q26 19.4 26 22 Q26 24.6 24 26.4" fill="none" stroke="#f5a93b" stroke-width="1.1" opacity="0.8"/>
  </g>
  <!-- bubbles -->
  <circle cx="42" cy="14" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="44" cy="20" r="1" fill="#ffffff" opacity="0.45"/>
  <circle cx="40.5" cy="9" r="0.9" fill="#ffffff" opacity="0.5"/>
  <!-- glass highlight -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#aqGlass)"/>
</svg>
